<!DOCTYPE html>
<html>
<head>
    <title>مواقيت الصلاة</title>

    <style>
        body{
            direction: rtl;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2b1055, #431a67, #1a0033);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
        }

        /* الكونتينر */
        #container{
            margin: auto;
            padding: 40px;
            max-width: 1100px;
        }

        h1{
            font-size: 55px;
            margin-bottom: 10px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        #date{
            font-size: 22px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        hr{
            border: none;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin-bottom: 30px;
        }

        /* البوكسات */
        #prayers-times{
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .prayer-box{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);

            width: 160px;
            text-align: center;
            padding: 20px;
            font-size: 22px;
            border-radius: 18px;
            transition: 0.3s;
        }

        .prayer-box:hover{
            transform: translateY(-8px);
            background: rgba(255,255,255,0.15);
        }

        .prayer-name{
            background: linear-gradient(45deg, #6f3f99, #9b59b6);
            padding: 6px;
            border-radius: 12px;
            font-weight: bold;
        }

        .prayer-time{
            margin-top: 15px;
            font-weight: bold;
            font-size: 20px;
        }

        /* اختيار المدينة */
        #city-box{
            display: flex;
            justify-content: center;
            margin-top: 70px;
        }

        #cities{
            width: 250px;
            height: 45px;
            font-size: 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            outline: none;
            padding: 5px;
            cursor: pointer;
        }

        #cities option{
            background: #2b1055;
        }
    </style>
</head>

<body>

<div id="container">

    <h1 id="main">الأسكندرية</h1>
    <div id="date">الأحد 23 مارس 2025</div>
    <hr>

    <div id="prayers-times">

        <div class="prayer-box">
            <div class="prayer-name">الفجر</div>
            <div class="prayer-time">04:11</div>
        </div>

        <div class="prayer-box">
            <div class="prayer-name">الشروق</div>
            <div class="prayer-time">04:11</div>
        </div>

        <div class="prayer-box">
            <div class="prayer-name">الظهر</div>
            <div class="prayer-time">04:11</div>
        </div>

        <div class="prayer-box">
            <div class="prayer-name">العصر</div>
            <div class="prayer-time">04:11</div>
        </div>

        <div class="prayer-box">
            <div class="prayer-name">المغرب</div>
            <div class="prayer-time">04:11</div>
        </div>

        <div class="prayer-box">
            <div class="prayer-name">العشاء</div>
            <div class="prayer-time">04:11</div>
        </div>

    </div>

    <div id="city-box">
        <select id="cities">
            <option>الأسكندرية</option>
            <option>القاهرة</option>
            <option>أسوان</option>
            <option>الرياض</option>
            <option>جدة</option>
            <option>الخبر</option>
        </select>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
